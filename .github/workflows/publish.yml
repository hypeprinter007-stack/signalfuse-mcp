name: Publish to npm

# This repo had no publish automation, and it showed: the runtime-version fix
# landed on main in eb41754 but never reached npm, so `npx signalfuse-mcp`
# kept serving the 2026-05-18 artifact whose index.js hardcoded 1.0.0 while
# its package.json claimed 1.1.2. The v1.1.3 tag was cut and nothing published
# it. Tag pushes now publish, and the gates below make the specific failure
# that caused this impossible to repeat.

on:
  push:
    tags:
      - 'v*'
  # Re-runnable by hand. A tag push fires once, so a failure outside our control
  # — npm trusted-publisher config not yet in place, a registry blip — would
  # otherwise need the tag deleted and re-pushed to retry. Publishing stays
  # idempotent per version: npm rejects a version that already exists, so a
  # stray dispatch cannot overwrite a release.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (Trusted Publishing requires npm >= 11.5.1)
        # Pin to the 11 line: >= 11.5.1 for Trusted Publishing, and still
        # supports Node 20. npm@latest (12.x) dropped Node 20 → EBADENGINE.
        run: npm install -g npm@11

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm install --no-audit --no-fund

      # Gates the release on the version contract itself: check-versions.mjs
      # compares package.json against server.json, and the protocol test asserts
      # the running server reports the package version over MCP. Publishing an
      # artifact that misreports its own version now fails here instead of
      # sitting on the registry for three months.
      - run: npm test

      - name: Verify the packed artifact reports the right version
        # The runtime reads ./package.json relative to index.js, so the version
        # is only correct if package.json actually ships in the tarball. Prove
        # that against the real pack output rather than the working tree.
        run: |
          PKG=$(node -p "require('./package.json').version")
          npm pack --silent >/dev/null
          tar xzf signalfuse-mcp-"$PKG".tgz
          PACKED=$(node -p "require('./package/package.json').version")
          if [ "$PACKED" != "$PKG" ]; then
            echo "Packed artifact reports $PACKED, expected $PKG"
            exit 1
          fi
          grep -q 'readFileSync' package/index.js || {
            echo "index.js no longer derives its version from package.json"; exit 1; }
          rm -rf package signalfuse-mcp-"$PKG".tgz

      - name: Publish to npm
        # Skip when this exact version is already on the registry, so a
        # dispatch re-run can carry on to the Registry step instead of dying
        # on "you cannot publish over an existing version". Versions are still
        # immutable — this never overwrites, it only declines to retry.
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "signalfuse-mcp@$PKG" version >/dev/null 2>&1; then
            echo "signalfuse-mcp@$PKG already published — skipping npm publish"
          else
            npm publish --provenance --access public
          fi

      # npm and the Registry as one sequence, not two. Previously the Registry
      # record was updated by hand, which is why it sat pointing at an npm
      # artifact whose runtime reported a different version than the record
      # claimed. Runs after npm publish so the Registry can never advertise a
      # package version that does not exist yet.
      - name: Publish to the MCP Registry
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/').tar.gz" \
            | tar xz mcp-publisher
          # OIDC against the io.github.hypeprinter007-stack/* namespace — same
          # id-token the npm provenance step uses, no stored credential.
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Verify the Registry resolves to the version we just published
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./server.json').name")
          SLUG=$(node -p "encodeURIComponent(require('./server.json').name)")
          sleep 10
          REC=$(curl -sS "https://registry.modelcontextprotocol.io/v0.1/servers/$SLUG/versions/latest")
          # The record nests the server object under `server`; tolerate both
          # shapes rather than assuming, since guessing wrong here fails the
          # run on a release that actually succeeded.
          GOT=$(echo "$REC" | jq -r '(.server // .).packages[0].version')
          echo "Registry $NAME → package version $GOT (expected $PKG)"
          [ "$GOT" = "$PKG" ] || { echo "Registry did not pick up $PKG"; echo "$REC" | head -c 400; exit 1; }
